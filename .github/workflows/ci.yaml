name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n nitro-fan.sh
      - name: python compile
        run: python3 -m py_compile nitro-gui.py
      - name: json validate
        run: python3 -c "import json; json.load(open('nbfc-quiet-curve.json'))"
